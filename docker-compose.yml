version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=policylens_docker_secret_key_2026_jwt_token_secure
      - DATABASE_URL=sqlite:///./policylens.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - backend-db:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-db:
